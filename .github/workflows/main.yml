name: Deploy Laravel Backend to iNET

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**' 

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Lấy code từ GitHub
      uses: actions/checkout@v3

    # (Đã xóa các bước cài PHP và Composer ở đây)

    - name: Đẩy code lên iNET qua FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./backend/
        server-dir: / 
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/vendor/** # 🔥 THÊM DÒNG NÀY VÀO
          .env
