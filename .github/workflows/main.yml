name: Deploy Laravel Backend to iNET

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**' # Chỉ kích hoạt khi có ai đó sửa code trong thư mục backend

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Lấy code từ GitHub
      uses: actions/checkout@v3

    - name: Cài đặt PHP & Composer
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4' # Đổi thành phiên bản PHP trên host của bạn

    - name: Cài đặt thư viện (Vendor)
      working-directory: ./backend
      run: composer install --no-dev --optimize-autoloader

    - name: Đẩy code lên iNET qua FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./backend/
        server-dir: / # Thư mục đích trên FTP
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          .env
